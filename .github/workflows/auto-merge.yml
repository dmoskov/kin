name: Auto-merge task branches

# When CI passes on a task/** branch, merge it into main automatically.
# Uses a direct merge commit (matching this repo's existing merge style) — no
# PR required. A conflicting branch is left untouched for a human to resolve.
# Merging to main then triggers CI on main, which triggers Deploy on success.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write

jobs:
  merge:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'task/')
    runs-on: ubuntu-latest
    steps:
      - name: Merge passing task branch into main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          echo "CI passed on '$BRANCH' — attempting merge into main"
          # merges API: 201 created / 204 nothing to merge -> success (exit 0);
          # 409 conflict -> gh api exits non-zero, leave for a human.
          if gh api -X POST "repos/$REPO/merges" \
               -f base=main -f head="$BRANCH" \
               -f commit_message="Merge $BRANCH (CI passed)"; then
            echo "Merged '$BRANCH' into main."
            gh api -X DELETE "repos/$REPO/git/refs/heads/$BRANCH" \
              && echo "Deleted merged branch '$BRANCH'." || echo "(branch delete skipped)"
          else
            echo "::warning title=Manual merge needed::'$BRANCH' could not be auto-merged (likely a conflict with main)."
          fi
