name: Auto-merge task branches

# When CI passes on a task/** branch, merge it into main automatically and
# deploy. Uses a direct merge commit (matching this repo's merge style) — no PR
# required; conflicting branches are left for a human. Deploy is called in this
# same run because a GITHUB_TOKEN merge would not re-trigger CI/Deploy on main.
#
# Auth/credential-tier branches (see governance/auth-tier-allowlist.md) are the
# one exception: they need a human sign-off entry in that file before this
# workflow will merge them unattended.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write

jobs:
  merge:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'task/')
    runs-on: ubuntu-latest
    outputs:
      merged: ${{ steps.merge.outputs.merged }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # See governance/auth-tier-allowlist.md: auth/credential-tier branches
      # need a human sign-off entry there before this workflow will merge them
      # unattended. Everything else is unaffected.
      - name: Check auth-tier sign-off
        id: authcheck
        continue-on-error: true
        env:
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          git fetch origin main "$BRANCH"
          python3 scripts/check_auth_tier_signoff.py "$BRANCH" origin/main "origin/$BRANCH"

      - name: Warn if blocked on auth-tier review
        if: steps.authcheck.outcome == 'failure'
        env:
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          echo "::warning title=Auth-tier review required::'$BRANCH' touches an auth-tier path with no sign-off in governance/auth-tier-allowlist.md — leaving for manual merge."

      - id: merge
        name: Merge passing task branch into main
        if: steps.authcheck.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          echo "CI passed on '$BRANCH' — attempting merge into main"
          # merges API: 201 created / 204 nothing to merge -> success;
          # 409 conflict -> gh api exits non-zero, leave for a human.
          if gh api -X POST "repos/$REPO/merges" \
               -f base=main -f head="$BRANCH" \
               -f commit_message="Merge $BRANCH (CI passed)"; then
            echo "merged=true" >> "$GITHUB_OUTPUT"
            echo "Merged '$BRANCH' into main."
            gh api -X DELETE "repos/$REPO/git/refs/heads/$BRANCH" \
              && echo "Deleted merged branch '$BRANCH'." || echo "(branch delete skipped)"
          else
            echo "merged=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Manual merge needed::'$BRANCH' could not be auto-merged (likely a conflict with main)."
          fi

  deploy:
    needs: merge
    if: needs.merge.outputs.merged == 'true'
    uses: ./.github/workflows/deploy-reusable.yml
    secrets: inherit
