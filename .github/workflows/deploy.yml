name: Deploy

# Deploy to production after CI passes on main (covers direct pushes to main by
# a human/PAT). Auto-merged task branches are deployed by auto-merge.yml itself,
# because a GITHUB_TOKEN merge does not re-trigger CI. Also runnable manually.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

# id-token is needed by deploy-reusable.yml to assume the AWS role via OIDC;
# a called workflow can never hold more permissions than its caller grants.
permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    uses: ./.github/workflows/deploy-reusable.yml
    secrets: inherit
