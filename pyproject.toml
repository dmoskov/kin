[project]
name = "family-tree"
version = "0.2.0"
requires-python = ">=3.11"
description = "Map your family tree — database-backed, shareable, with relationship calculation and timelines."
license = "MIT"

[project.scripts]
family-tree = "cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# src/ holds top-level modules (cli, web_server, ...) plus packages
# (database, routes, ...); both must be listed or `pip install -e .`
# silently installs nothing and `python -m cli` breaks.
[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["cli", "web_server", "dates", "exif_utils", "geocoder", "storage", "wikipedia"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
files = ["src"]
mypy_path = "src"
explicit_package_bases = true
ignore_missing_imports = true
# __init__.py / __main__.py are top-level scripts under src/ (pythonpath=src),
# which collide during module discovery; they hold only a re-export and an
# entry point, so they are not type-checked.
exclude = '^src/__(init|main)__\.py$'

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: isort, UP: pyupgrade, B: bugbear
select = ["E", "W", "F", "I", "UP", "B"]
ignore = [
    "E501",  # line length not strictly enforced
    "B008",  # function calls in argument defaults (common in Flask/Click)
]
